name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Plugin (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint protos
        run: buf lint
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: 200-line limit
        run: ./scripts/check-lines.sh
      - name: Generated example is up to date
        run: |
          go build -trimpath -ldflags "-X main.version=v0.1.0" -o bin/protoc-gen-codemode ./plugin/cmd/protoc-gen-codemode
          rm -rf examples/library/gen
          buf generate --template examples/library/buf.gen.yaml
          git diff --exit-code -- examples/library/gen

  typescript:
    name: Runtime (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Type-check
        if: matrix.runtime == 'node'
        run: npm run typecheck
      - name: Test on Node
        if: matrix.runtime == 'node'
        run: npm test
      - name: Test on Bun
        if: matrix.runtime == 'bun'
        run: npm run test:bun --workspaces --if-present
      - name: Test on Deno
        if: matrix.runtime == 'deno'
        run: npm run test:deno --workspaces --if-present
