name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The example uses the runtime-ts packages from a checkout beside this one
# (file:../../../runtime/runtime-ts/<package>) until they are on npm. Bump
# the ref when the generated code needs a newer runtime.
env:
  RUNTIME_TS_REF: e9c7b5a8f4189f987d5b76260dfc5cd759cd0b47

jobs:
  go:
    name: Plugin (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint protos
        run: buf lint
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: 200-line limit
        run: ./scripts/check-lines.sh
      - name: Generated example is up to date
        run: |
          go build -trimpath -ldflags "-X main.version=v0.1.0" -o bin/protoc-gen-codemode ./plugin/cmd/protoc-gen-codemode
          rm -rf examples/library/gen
          buf generate --template examples/library/buf.gen.yaml
          git diff --exit-code -- examples/library/gen

  typescript:
    name: Runtime (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    defaults:
      run:
        working-directory: codemode
    steps:
      - uses: actions/checkout@v6
        with:
          path: codemode
      - uses: actions/checkout@v6
        with:
          repository: the-protobuf-project/runtime-ts
          ref: ${{ env.RUNTIME_TS_REF }}
          path: runtime/runtime-ts
          # runtime-ts is private for now; a token that can read it is needed
          # until it is public.
          token: ${{ secrets.RUNTIME_TS_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build runtime-ts
        working-directory: runtime/runtime-ts
        run: |
          npm ci
          npm run build
      - run: npm ci
      - name: Type-check
        if: matrix.runtime == 'node'
        run: npm run typecheck
      - name: Test on Node
        if: matrix.runtime == 'node'
        run: npm test
      - name: Test on Bun
        if: matrix.runtime == 'bun'
        run: npm run test:bun --workspaces --if-present
      - name: Test on Deno
        if: matrix.runtime == 'deno'
        run: npm run test:deno --workspaces --if-present
