name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # The runtime-ts packages come from GitHub Packages, which needs a token.
  packages: read

jobs:
  go:
    name: Plugin (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint protos
        run: buf lint
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: 200-line limit
        run: ./scripts/check-lines.sh
      - name: Generated example is up to date
        run: |
          go build -trimpath -ldflags "-X main.version=v0.1.0" -o bin/protoc-gen-codemode ./plugin/cmd/protoc-gen-codemode
          rm -rf examples/library/gen
          buf generate --template examples/library/buf.gen.yaml
          git diff --exit-code -- examples/library/gen

  typescript:
    name: Example (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node, deno]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        if: matrix.runtime == 'node'
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - run: bun install
      - name: Lint, type-check and test on Bun
        if: matrix.runtime == 'bun'
        run: |
          bun run lint
          bun run typecheck
          bun run test
      - name: Test on Node
        if: matrix.runtime == 'node'
        run: bun run test:node
      - name: Test on Deno
        if: matrix.runtime == 'deno'
        run: bun run test:deno
